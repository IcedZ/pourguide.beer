# The guides listed on pourguide.beer, in the order shown.
#
#   id       Short name. Also the subdomain: gnv → gnv.pourguide.beer
#   name     The city or region, as it should appear
#   region   Shown under the name
#   url      The guide's address
#   status   live, or soon (shown without a link, as "Coming soon")
#   data     Optional. Where the guide publishes its data.json, which gives the brewery
#            count and the row of glasses. Leave it out to use <url>/data.json.
#
# To add a city, copy the gnv block below and change the values.

guides:
  - id: gnv
    name: Gainesville
    region: Florida
    url: https://gnv.pourguide.beer
    status: live
    # gnv.pourguide.beer isn't set up yet, so read the numbers from the current address.
    # Delete this line once the guide has moved; it will then use the url above.
    data: https://gnv.beer/data.json
