# Builds pourguide.beer and every city guide, and uploads them to the web host over FTP.
#
# One-time setup, in this repo on GitHub: Settings → Secrets and variables → Actions → New repository secret
#   FTP_SERVER     your FastComet server hostname (cPanel → FTP Accounts → Configure FTP Client)
#   FTP_USERNAME   the FTP account for pourguide.beer's main folder
#   FTP_PASSWORD
#   FTP_DIR        ./  (the account opens in pourguide.beer's folder; guides go in loc/<id>)
#
# If your host doesn't support FTPS, change `protocol: ftps` to `protocol: ftp`.
name: Build and upload to web host

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 4 hours. Times are UTC: 3, 7 and 11 AM, 3, 7 and 11 PM Eastern (an hour later during daylight saving time).
    - cron: '7 */4 * * *'

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Last good copy of each brewery source and of each location's build, so one
      # brewery's site (or one location) being down doesn't blank anything.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: sources-${{ github.run_id }}
          restore-keys: sources-

      - run: npm ci
      - run: npm run build

      - name: Report source health
        run: node scripts/check-sources.mjs
        continue-on-error: true

      - name: Upload to web host
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_DIR }}
          # Only changed files are sent after the first upload.
          exclude: |
            **/.git*
            **/.git*/**
